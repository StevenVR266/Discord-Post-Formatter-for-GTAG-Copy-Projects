<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generate formatted Discord forum posts for Unity Hub projects and assets.">
  <title>Unity Hub Post Generator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1 class="app-title">Unity Hub Post Generator</h1>
    </header>

    <main class="app-main">
      <!-- INPUT FORM PANEL -->
      <section class="panel" aria-labelledby="form-heading">
        <div class="panel__header">
          <h2 id="form-heading" class="panel__title">✏️ Post Details</h2>
          <button type="button" id="btn-clear" class="btn btn--ghost">Clear All</button>
        </div>

        <form id="post-form" class="form-grid" novalidate>
          <div class="form-group">
            <label for="input-type" class="form-label">Target Channel / Post Type</label>
            <select id="input-type" name="type" class="form-control">
              <option value="📌 " selected>📌 Pinned Post (#post-projects)</option>
              <option value="📁┃">📁 Unity Project (#post-projects)</option>
              <option value="📦┃">📦 Unity Package (#post-packages)</option>
              <option value="📄┃">📄 C# Script (#post-scripts)</option>
              <option value="🗳️┃">🗳️ Shader (#post-shaders)</option>
              <option value="📰┃">📰 PlayFab DLC Catalog (#dlcs)</option>
              <option value="📝┃">📝 PlayFab Revision / CloudScript (#revisions)</option>
              <option value="🔧┃">🔧 Bug Fix (#fixes)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="input-name" class="form-label">Title / Resource Name</label>
            <input 
              type="text" 
              id="input-name" 
              name="name" 
              class="form-control" 
              placeholder="e.g. Mountain Beta" 
              value="Mountain Beta"
              required
            >
          </div>

          <div class="form-group">
            <label for="input-features" class="form-label">Features / Contents (One per line)</label>
            <textarea 
              id="input-features" 
              name="features" 
              class="form-control form-control--textarea" 
              placeholder="Working Servers&#10;Server Sided Cosmetics"
            >Working Servers
Server Sided Cosmetics</textarea>
          </div>

          <div class="form-group">
            <label for="input-download" class="form-label">Download Link</label>
            <input 
              type="url" 
              id="input-download" 
              name="download" 
              class="form-control" 
              placeholder="https://link-hub.net/..." 
              value="https://link-hub.net/462720/oRXB1ktAt4Yv"
            >
          </div>

          <div class="form-group">
            <label for="input-virustotal" class="form-label">VirusTotal Link (Optional)</label>
            <input 
              type="url" 
              id="input-virustotal" 
              name="virustotal" 
              class="form-control" 
              placeholder="https://virustotal.com/gui/file/..."
            >
          </div>

          <div class="form-group">
            <label for="input-credits" class="form-label">Credits</label>
            <input 
              type="text" 
              id="input-credits" 
              name="credits" 
              class="form-control" 
              placeholder="e.g. Steven" 
              value="Steven"
            >
          </div>

          <div class="form-group">
            <label for="input-image" class="form-label">Image URL (Optional)</label>
            <input 
              type="url" 
              id="input-image" 
              name="image" 
              class="form-control" 
              placeholder="https://i.imgur.com/..."
            >
          </div>
        </form>
      </section>

      <!-- PREVIEW & OUTPUT PANEL -->
      <section class="panel" aria-labelledby="output-heading">
        <div class="panel__header">
          <h2 id="output-heading" class="panel__title">📋 Generated Output</h2>
        </div>

        <div class="output-grid">
          <div class="form-group">
            <label for="output-title" class="form-label">Thread Title</label>
            <input type="text" id="output-title" class="form-control" readonly>
            <button type="button" id="btn-copy-title" class="btn btn--primary" data-copy-target="output-title">
              Copy Title
            </button>
          </div>

          <div class="form-group form-group--grow">
            <label for="output-content" class="form-label">Post Body Content</label>
            <textarea id="output-content" class="form-control form-control--code" readonly></textarea>
            <button type="button" id="btn-copy-content" class="btn btn--primary" data-copy-target="output-content">
              Copy Post Content
            </button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="a11y-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
